name: detr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip=25.0
  - pip:
      # Entorno separado: RF-DETR requiere Transformers >= 5.9, incompatible con
      # el Transformers 4.44.2 que necesita el cuaderno de TrOCR (env.yml).
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      # Librerías de la guía de detección de objetos de Transformers.
      - transformers==5.17.0
      - datasets==5.0.1
      - accelerate==1.15.0
      - timm==1.0.30
      - trackio==0.39.0
      - torchmetrics==1.9.0
      - pycocotools==2.0.11
      - albumentations==2.0.8
      # Visualización de las etapas del pipeline (cuaderno Pipeline_Placas_OCR).
      - matplotlib==3.11.2
      # OCR de placas preentrenado (+65 países) para comparar en el pipeline; ONNX Runtime en CPU.
      - fast-plate-ocr[onnx]==1.1.0
      # Exportación de RF-DETR a TFLite (PyTorch -> LiteRT sin TensorFlow). litert-torch 0.9.0 es la última
      # versión que no exige torchao >= 0.17, incompatible con PyTorch 2.7; torchao 0.12 sí lo es.
      - litert-torch==0.9.0
      - torchao==0.12.0
      # Kernel para el JupyterLab del entorno trocr (misma versión de ipywidgets).
      - ipykernel==6.29.5
      - ipywidgets==8.1.5
