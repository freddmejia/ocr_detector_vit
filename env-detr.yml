name: detr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip=25.0
  - pip:
      # Entorno separado: RF-DETR requiere Transformers >= 5.9, incompatible con
      # el Transformers 4.44.2 que necesita el cuaderno de TrOCR (env.yml).
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      # Librerías de la guía de detección de objetos de Transformers.
      - transformers==5.17.0
      - datasets==5.0.1
      - accelerate==1.15.0
      - timm==1.0.30
      - trackio==0.39.0
      - torchmetrics==1.9.0
      - pycocotools==2.0.11
      - albumentations==2.0.8
      # Visualización de las etapas del pipeline (cuaderno Pipeline_Placas_OCR).
      - matplotlib==3.11.2
      # Kernel para el JupyterLab del entorno trocr (misma versión de ipywidgets).
      - ipykernel==6.29.5
      - ipywidgets==8.1.5
