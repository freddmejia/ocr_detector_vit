name: trocr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip=25.0
  - pip:
      # CUDA 12.8 incluye soporte para Blackwell / RTX 50 (sm_120).
      # El sufijo evita instalar por error la variante CUDA 12.6 de PyPI.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      # Compatibilidad con evaluation_strategy, feature_extractor y load_metric.
      - transformers==4.44.2
      - datasets==2.21.0
      - accelerate==0.34.2
      - huggingface-hub==0.24.7
      - numpy==1.26.4
      - pyarrow==17.0.0
      - pandas==2.2.3
      - scikit-learn==1.5.2
      - Pillow==11.1.0
      - jiwer==3.0.5
      - sentencepiece==0.2.0
      - protobuf==4.25.5
      - jupyterlab==4.3.5
      - ipykernel==6.29.5
      - ipywidgets==8.1.5
