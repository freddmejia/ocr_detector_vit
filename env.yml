name: trocr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip=25.0
  - pip:
      # PyPI distribuye torch 2.6.0 para Linux x86_64 con CUDA 12.4.
      # También funciona en CPU cuando no hay GPU disponible.
      - torch==2.6.0
      # Compatibilidad con evaluation_strategy, feature_extractor y load_metric.
      - transformers==4.44.2
      - datasets==2.21.0
      - accelerate==0.34.2
      - huggingface-hub==0.24.7
      - numpy==1.26.4
      - pyarrow==17.0.0
      - pandas==2.2.3
      - scikit-learn==1.5.2
      - Pillow==11.1.0
      - jiwer==3.0.5
      - sentencepiece==0.2.0
      - protobuf==4.25.5
      - jupyterlab==4.3.5
      - ipykernel==6.29.5
      - ipywidgets==8.1.5
